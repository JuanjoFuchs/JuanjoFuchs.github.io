name: Schedule Jekyll Post Publishing

on:
  schedule:
    # Runs every Tuesday at 2:00 PM UTC (9:00 AM EST / 10:00 AM EDT)
    # This keeps posts publishing at 9 AM Eastern Standard Time year-round
    # (or 10 AM during Daylight Time in spring-fall)
    - cron: '0 14 * * 2'

  # Allows you to manually trigger the workflow from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Git
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"

    - name: Trigger rebuild for scheduled posts
      run: |
        # Create an empty commit to trigger GitHub Pages rebuild
        # This allows Jekyll to re-evaluate post dates and publish future-dated posts
        git commit --allow-empty -m "chore: trigger rebuild for scheduled posts"
        git push

  post-to-social-media:
    runs-on: ubuntu-latest
    needs: rebuild

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        cd scripts
        npm install

    - name: Find and post newly published posts
      env:
        X_API_KEY: ${{ secrets.X_API_KEY }}
        X_API_SECRET: ${{ secrets.X_API_SECRET }}
        X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
        X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      run: |
        echo "Looking for newly published posts..."

        # Get current date in YYYY-MM-DD format
        CURRENT_DATE=$(date -u +%Y-%m-%d)

        # Get date 7 days ago (to catch this week's posts)
        WEEK_AGO=$(date -u -d '7 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-7d +%Y-%m-%d)

        echo "Current date: $CURRENT_DATE"
        echo "Looking for posts from: $WEEK_AGO to $CURRENT_DATE"

        # Find posts with dates within the last 7 days
        POSTS_FOUND=false
        for post in _posts/*.md; do
          if [ -f "$post" ]; then
            # Extract date from filename (YYYY-MM-DD)
            POST_DATE=$(basename "$post" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}')

            if [ ! -z "$POST_DATE" ]; then
              # Compare dates (only post if date is within last 7 days and not in future)
              if [[ "$POST_DATE" > "$WEEK_AGO" || "$POST_DATE" == "$WEEK_AGO" ]] && [[ "$POST_DATE" < "$CURRENT_DATE" || "$POST_DATE" == "$CURRENT_DATE" ]]; then
                echo ""
                echo "=================================================="
                echo "Processing: $(basename "$post")"
                echo "Post date: $POST_DATE"
                echo "=================================================="
                POSTS_FOUND=true

                # Run the social media posting script
                node scripts/post-to-social-media.js "$post" || true
              fi
            fi
          fi
        done

        if [ "$POSTS_FOUND" = false ]; then
          echo "No newly published posts found in the last 7 days"
        fi

    - name: Commit published flags
      run: |
        # Configure Git
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"

        # Check if there are any changes to commit
        if git diff --quiet _posts/; then
          echo "No changes to commit - no posts were marked as published"
        else
          echo "Changes detected in _posts/ directory"

          # Commit first, then rebase and push
          # (git pull --rebase fails with staged changes, so commit first)
          git add _posts/
          git commit -m "chore: mark social media posts as published [skip ci]"

          # Pull latest changes from rebuild job to avoid race condition
          git pull --rebase origin main

          git push
          echo "✓ Published flags committed and pushed"
        fi
