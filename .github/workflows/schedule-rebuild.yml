name: Schedule Jekyll Post Publishing

on:
  schedule:
    # Runs every Tuesday at 1:00 PM UTC (9:00 AM EDT / 8:00 AM EST)
    # Note: This is 9 AM Eastern Daylight Time (spring-fall) or 8 AM Eastern Standard Time (winter)
    # Adjust to '0 14 * * 2' if you prefer 9 AM EST year-round (10 AM during summer)
    - cron: '0 13 * * 2'

  # Allows you to manually trigger the workflow from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Git
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"

    - name: Trigger rebuild for scheduled posts
      run: |
        # Create an empty commit to trigger GitHub Pages rebuild
        # This allows Jekyll to re-evaluate post dates and publish future-dated posts
        git commit --allow-empty -m "chore: trigger rebuild for scheduled posts [skip ci]"
        git push
