name: Daily Social Promotion

on:
  schedule:
    # Tuesday-Friday: 12:00 PM America/New_York while on EDT, 4:00 PM once on EST.
    # That split IS the 20261020-daily-promotion-li trial (pre-registered in the vault's
    # Community Growth Strategy): weeks 1-2 (Oct 20-30, EDT) at noon, weeks 3-4
    # (Nov 3-13, EST after the Nov 1 change) at 4 PM. Revisit at the 11/16 readout.
    # GitHub cron can be delayed on free plans; this workflow handles rebuild,
    # waits for Pages deployment, then posts the matching campaign entry.
    # GitHub cron is UTC-only, so each slot is pinned to one offset and gated in-job.
    - cron: '0 16 * * 2-5'
    - cron: '0 21 * * 2-5'

  workflow_dispatch:
    inputs:
      date:
        description: 'Campaign date to post (YYYY-MM-DD). Defaults to today.'
        required: false
        type: string
      platform:
        description: 'Platform to post'
        required: false
        default: all
        type: choice
        options:
          - all
          - linkedin
          - twitter
      dry_run:
        description: 'Validate without posting'
        required: false
        default: true
        type: boolean
      rebuild:
        description: 'Trigger and wait for a Jekyll Pages rebuild before posting'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  post-daily-social:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Determine publish context
      run: |
        if [ "${{ github.event_name }}" != "schedule" ]; then
          echo "SHOULD_POST_DAILY_SOCIAL=true" >> "$GITHUB_ENV"
          if [ -n "${{ inputs.date }}" ]; then
            echo "CAMPAIGN_DATE=${{ inputs.date }}" >> "$GITHUB_ENV"
          else
            echo "CAMPAIGN_DATE=$(TZ=America/New_York date +%F)" >> "$GITHUB_ENV"
          fi
          # A deploy has no side effects beyond redeploying main, so a dry run may
          # still exercise it (rebuild=true) to prove the promotion finds its deploy.
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            echo "SHOULD_REBUILD_JEKYLL=true" >> "$GITHUB_ENV"
          else
            echo "SHOULD_REBUILD_JEKYLL=false" >> "$GITHUB_ENV"
          fi
          exit 0
        fi

        EASTERN_OFFSET=$(TZ=America/New_York date +%z)
        EASTERN_DOW=$(TZ=America/New_York date +%u)
        EASTERN_DATE=$(TZ=America/New_York date +%F)
        TRIGGERED_SCHEDULE="${{ github.event.schedule }}"

        if [ "$EASTERN_OFFSET" = "-0400" ]; then
          EXPECTED_SCHEDULE="0 16 * * 2-5"   # noon EDT
        else
          EXPECTED_SCHEDULE="0 21 * * 2-5"   # 4 PM EST
        fi

        if [ "$TRIGGERED_SCHEDULE" = "$EXPECTED_SCHEDULE" ]; then
          echo "SHOULD_POST_DAILY_SOCIAL=true" >> "$GITHUB_ENV"
          echo "CAMPAIGN_DATE=$EASTERN_DATE" >> "$GITHUB_ENV"
          if [ "$EASTERN_DOW" = "2" ]; then
            echo "SHOULD_REBUILD_JEKYLL=true" >> "$GITHUB_ENV"
          else
            echo "SHOULD_REBUILD_JEKYLL=false" >> "$GITHUB_ENV"
          fi
        else
          echo "Skipping ${TRIGGERED_SCHEDULE} because Eastern offset is ${EASTERN_OFFSET}; expected ${EXPECTED_SCHEDULE}"
          echo "SHOULD_POST_DAILY_SOCIAL=false" >> "$GITHUB_ENV"
          echo "SHOULD_REBUILD_JEKYLL=false" >> "$GITHUB_ENV"
        fi

    - name: Skip when no campaign entry matches the date
      if: env.SHOULD_POST_DAILY_SOCIAL == 'true'
      run: |
        # Campaign entries carry an uppercase "DATE: YYYY-MM-DD" line; the
        # frontmatter uses lowercase "date:" with a time, so this only matches
        # real ## Social Campaign entries. When none match today, fully no-op
        # (no rebuild, no post) so the daily workflow stays out of the way
        # during the weekly-only window and never races weekly-social-promotion
        # over the Tuesday rebuild.
        CAMPAIGN_POST_FILE=$(grep -rlE "^DATE:[[:space:]]*${CAMPAIGN_DATE}([[:space:]]|$)" _posts/ | head -n 1 || true)
        if [ -n "$CAMPAIGN_POST_FILE" ]; then
          echo "Found a campaign entry for ${CAMPAIGN_DATE} in ${CAMPAIGN_POST_FILE}."
          echo "CAMPAIGN_POST_FILE=$CAMPAIGN_POST_FILE" >> "$GITHUB_ENV"
        else
          echo "No campaign entry for ${CAMPAIGN_DATE}; daily promotion will no-op."
          echo "SHOULD_POST_DAILY_SOCIAL=false" >> "$GITHUB_ENV"
          echo "SHOULD_REBUILD_JEKYLL=false" >> "$GITHUB_ENV"
        fi

    # Pages deploys through link-check.yml (build, link check, deploy). A push made
    # with GITHUB_TOKEN doesn't trigger workflows, so dispatch it and wait for that
    # exact run; a broken link fails it and the promotion stops before posting.
    - name: Trigger site deploy
      if: ${{ env.SHOULD_POST_DAILY_SOCIAL == 'true' && env.SHOULD_REBUILD_JEKYLL == 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "DEPLOY_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
        gh workflow run link-check.yml --ref main

    - name: Wait for site deploy
      if: ${{ env.SHOULD_POST_DAILY_SOCIAL == 'true' && env.SHOULD_REBUILD_JEKYLL == 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        RUN_ID=""
        for attempt in $(seq 1 60); do
          RUN_ID=$(gh run list --workflow link-check.yml --event workflow_dispatch --branch main --limit 10 --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"${DEPLOY_START}\")] | sort_by(.createdAt) | .[0].databaseId // empty")
          if [ -n "$RUN_ID" ]; then
            break
          fi
          echo "Waiting for the dispatched deploy run (attempt ${attempt}/60)"
          sleep 10
        done

        if [ -z "$RUN_ID" ]; then
          echo "Timed out waiting for the dispatched deploy run"
          exit 1
        fi

        echo "Watching deploy run ${RUN_ID}"
        gh run watch "$RUN_ID" --exit-status --interval 10

    - name: Setup Node.js
      if: env.SHOULD_POST_DAILY_SOCIAL == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      id: deps
      if: env.SHOULD_POST_DAILY_SOCIAL == 'true'
      working-directory: scripts
      run: npm install

    - name: Verify the post is live before promoting
      id: live
      if: ${{ env.SHOULD_POST_DAILY_SOCIAL == 'true' && github.event.inputs.dry_run != 'true' }}
      run: |
        # Confirm the canonical post URL actually serves (HTTP 200) before we
        # post. A future-dated or not-yet-built post would otherwise be promoted
        # with links that 404. Uses the same URL the social posts link to.
        URL=$(node --input-type=module -e "import { extractSocialContent } from './scripts/extract-social-content.js'; const r = extractSocialContent(process.argv[1]); if (!r.blogUrl) process.exit(2); console.log(r.blogUrl);" "$CAMPAIGN_POST_FILE")
        echo "Verifying ${URL}"
        for attempt in $(seq 1 20); do
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ "$CODE" = "200" ]; then
            echo "Post is live (HTTP 200)."
            echo "POST_URL=$URL" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Not live yet (HTTP ${CODE}); attempt ${attempt}/20"
          sleep 15
        done
        echo "::error::Post ${URL} never returned 200; refusing to promote with dead links. Check the post date offset (should be EDT/EST for its date) and that Pages built."
        exit 1

    # Bing (and so Copilot and DuckDuckGo) otherwise finds a new post only when it
    # next re-reads the sitemap. Launch day only, with the URL the live check just
    # got a 200 from, so IndexNow is never told about a page that 404s. A failed
    # ping must not hold back the posts, hence continue-on-error.
    - name: Ping IndexNow on launch day
      if: ${{ steps.live.outcome == 'success' }}
      continue-on-error: true
      run: |
        case "$CAMPAIGN_POST_FILE" in
          _posts/${CAMPAIGN_DATE}-*) ;;
          *) echo "Not launch day for ${CAMPAIGN_POST_FILE}; no IndexNow ping."; exit 0 ;;
        esac

        node scripts/ping-indexnow.js "$POST_URL"

    - name: Prepare LinkedIn access token
      if: env.SHOULD_POST_DAILY_SOCIAL == 'true'
      env:
        LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
        LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
        LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
      run: node scripts/refresh-linkedin-token.js

    - name: Post daily social campaign entries
      if: env.SHOULD_POST_DAILY_SOCIAL == 'true'
      env:
        X_API_KEY: ${{ secrets.X_API_KEY }}
        X_API_SECRET: ${{ secrets.X_API_SECRET }}
        X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
        X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        SOCIAL_LINKEDIN_ENABLED: ${{ vars.SOCIAL_LINKEDIN_ENABLED }}
        SOCIAL_X_ENABLED: ${{ vars.SOCIAL_X_ENABLED }}
      run: |
        ARGS=()
        ARGS+=(--date "$CAMPAIGN_DATE")

        if [ -n "${{ inputs.platform }}" ]; then
          ARGS+=(--platform "${{ inputs.platform }}")
        fi

        if [ "${{ inputs.dry_run }}" = "true" ]; then
          ARGS+=(--dry-run)
        fi

        node scripts/post-daily-social.js "${ARGS[@]}"

    # The weekly workflow is the only other place that emails the Kit list, and it
    # no-ops on a daily-campaign post, so without this a campaign post's newsletter
    # never sent. Launch day only: the post file's own date must be today's
    # campaign date. Same guards as the weekly step: always() so a failed platform
    # doesn't hold back the email, but only once the post is live, and
    # send-kit-broadcast.js skips a post that already carries KIT_SENT.
    - name: Email the post to the Kit list on launch day
      if: ${{ always() && env.SHOULD_POST_DAILY_SOCIAL == 'true' && steps.deps.outcome == 'success' && (steps.live.outcome == 'success' || github.event.inputs.dry_run == 'true') }}
      env:
        KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
      run: |
        case "$CAMPAIGN_POST_FILE" in
          _posts/${CAMPAIGN_DATE}-*) ;;
          *) echo "Not launch day for ${CAMPAIGN_POST_FILE}; no newsletter."; exit 0 ;;
        esac

        if [ -z "$KIT_API_KEY" ]; then
          echo "::warning::KIT_API_KEY is not set; skipping the newsletter send"
          exit 0
        fi

        ARGS=("$CAMPAIGN_POST_FILE")

        if [ "${{ inputs.dry_run }}" = "true" ]; then
          ARGS+=(--dry-run)
        fi

        node scripts/send-kit-broadcast.js "${ARGS[@]}"

    # always(): post-daily-social.js exits non-zero on failure, and the PUBLISHED
    # markers for whatever DID post must still be committed. Otherwise a re-run to fix
    # the failed platform would double-post the one that already succeeded.
    - name: Commit published flags
      if: ${{ always() && env.SHOULD_POST_DAILY_SOCIAL == 'true' && github.event.inputs.dry_run != 'true' }}
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"

        if git diff --quiet _posts/; then
          echo "No campaign entries were marked as published"
        else
          git add _posts/
          git commit -m "chore: mark daily social campaign entries as published [skip ci]"
          git pull --rebase origin main
          git push
          echo "Published flags committed and pushed"
        fi
