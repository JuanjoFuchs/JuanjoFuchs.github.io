name: Build, check links and deploy

# Builds the site with the same builder GitHub Pages used before, fails if any
# internal link points to a page that doesn't exist, and deploys only when that
# check passes. Added 2026-10-27 after a home-page template sent every category
# link to a 404 for weeks. The promotion workflows dispatch this workflow and
# wait for it instead of pages-build-deployment.
# Rollback: gh api -X PUT repos/JuanjoFuchs/JuanjoFuchs.github.io/pages -f build_type=legacy
# (and revert the promotion workflows' "Trigger site deploy" steps).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the GitHub Pages builder
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Check internal links
        run: |
          gem install html-proofer -v "~> 5.0" --no-document
          htmlproofer ./_site \
            --checks Links \
            --disable-external \
            --allow-missing-href \
            --no-enforce-https \
            --swap-urls "^https\://juanjofuchs\.com:"

      - name: Upload the site for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-and-check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
