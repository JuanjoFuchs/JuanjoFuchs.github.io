name: Weekly Social Promotion

on:
  schedule:
    # Tuesday at 9:00 AM America/New_York — launch day, one post per week.
    # GitHub cron is UTC-only, so run at both possible Eastern offsets and gate in-job.
    - cron: '0 13 * * 2'
    - cron: '0 14 * * 2'

  workflow_dispatch:
    inputs:
      date:
        description: 'Post date to promote (YYYY-MM-DD, matches the _posts filename). Defaults to today.'
        required: false
        type: string
      dry_run:
        description: 'Validate without posting'
        required: false
        default: true
        type: boolean
      rebuild:
        description: 'Trigger and wait for a Jekyll Pages rebuild before posting'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  post-weekly-social:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Determine publish context
      run: |
        if [ "${{ github.event_name }}" != "schedule" ]; then
          echo "SHOULD_POST_WEEKLY_SOCIAL=true" >> "$GITHUB_ENV"
          if [ -n "${{ inputs.date }}" ]; then
            echo "CAMPAIGN_DATE=${{ inputs.date }}" >> "$GITHUB_ENV"
          else
            echo "CAMPAIGN_DATE=$(TZ=America/New_York date +%F)" >> "$GITHUB_ENV"
          fi
          if [ "${{ inputs.rebuild }}" = "true" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "SHOULD_REBUILD_JEKYLL=true" >> "$GITHUB_ENV"
          else
            echo "SHOULD_REBUILD_JEKYLL=false" >> "$GITHUB_ENV"
          fi
          exit 0
        fi

        EASTERN_OFFSET=$(TZ=America/New_York date +%z)
        EASTERN_DATE=$(TZ=America/New_York date +%F)
        TRIGGERED_SCHEDULE="${{ github.event.schedule }}"

        if [ "$EASTERN_OFFSET" = "-0400" ]; then
          EXPECTED_SCHEDULE="0 13 * * 2"
        else
          EXPECTED_SCHEDULE="0 14 * * 2"
        fi

        if [ "$TRIGGERED_SCHEDULE" = "$EXPECTED_SCHEDULE" ]; then
          echo "SHOULD_POST_WEEKLY_SOCIAL=true" >> "$GITHUB_ENV"
          echo "CAMPAIGN_DATE=$EASTERN_DATE" >> "$GITHUB_ENV"
          # Launch day: rebuild so the post is live before we promote it.
          echo "SHOULD_REBUILD_JEKYLL=true" >> "$GITHUB_ENV"
        else
          echo "Skipping ${TRIGGERED_SCHEDULE} because Eastern offset is ${EASTERN_OFFSET}; expected ${EXPECTED_SCHEDULE}"
          echo "SHOULD_POST_WEEKLY_SOCIAL=false" >> "$GITHUB_ENV"
          echo "SHOULD_REBUILD_JEKYLL=false" >> "$GITHUB_ENV"
        fi

    - name: Resolve post file and gate on one-shot content
      if: env.SHOULD_POST_WEEKLY_SOCIAL == 'true'
      run: |
        POST_FILE=$(ls _posts/${CAMPAIGN_DATE}-*.md 2>/dev/null | head -n 1 || true)
        if [ -z "$POST_FILE" ]; then
          echo "No post file for ${CAMPAIGN_DATE}; weekly promotion will no-op."
          echo "SHOULD_POST_WEEKLY_SOCIAL=false" >> "$GITHUB_ENV"
          echo "SHOULD_REBUILD_JEKYLL=false" >> "$GITHUB_ENV"
          exit 0
        fi

        # Only the one-shot weekly format (top-level "## LinkedIn Post" /
        # "## X/Twitter Thread") is posted here. A daily-campaign post uses
        # "## Social Campaign" with "#### LinkedIn Post" sub-sections and is
        # handled by daily-social-promotion.yml, so we no-op on those.
        if grep -qE "^## (LinkedIn Post|X/Twitter Thread)" "$POST_FILE"; then
          echo "Found one-shot social content in ${POST_FILE}."
          echo "POST_FILE=$POST_FILE" >> "$GITHUB_ENV"
        else
          echo "${POST_FILE} has no one-shot ## LinkedIn Post / ## X/Twitter Thread section (likely a daily-campaign post); weekly promotion will no-op."
          echo "SHOULD_POST_WEEKLY_SOCIAL=false" >> "$GITHUB_ENV"
          echo "SHOULD_REBUILD_JEKYLL=false" >> "$GITHUB_ENV"
        fi

    - name: Trigger scheduled Jekyll rebuild
      if: ${{ env.SHOULD_POST_WEEKLY_SOCIAL == 'true' && env.SHOULD_REBUILD_JEKYLL == 'true' }}
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git pull --rebase origin main
        git commit --allow-empty -m "chore: trigger scheduled Jekyll rebuild"
        git push
        echo "REBUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

    - name: Wait for GitHub Pages deployment
      if: ${{ env.SHOULD_POST_WEEKLY_SOCIAL == 'true' && env.SHOULD_REBUILD_JEKYLL == 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PAGES_WORKFLOW_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --jq '.workflows[] | select(.name == "pages-build-deployment") | .id' | head -n 1)
        if [ -z "$PAGES_WORKFLOW_ID" ]; then
          echo "Could not find GitHub Pages workflow"
          exit 1
        fi

        RUN_ID=""
        for attempt in $(seq 1 60); do
          RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${PAGES_WORKFLOW_ID}/runs?head_sha=${REBUILD_SHA}&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -n "$RUN_ID" ]; then
            break
          fi
          echo "Waiting for Pages run for ${REBUILD_SHA} (attempt ${attempt}/60)"
          sleep 10
        done

        if [ -z "$RUN_ID" ]; then
          echo "Timed out waiting for Pages run to appear for ${REBUILD_SHA}"
          exit 1
        fi

        gh run watch "$RUN_ID" --exit-status --interval 10

    - name: Setup Node.js
      if: env.SHOULD_POST_WEEKLY_SOCIAL == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      if: env.SHOULD_POST_WEEKLY_SOCIAL == 'true'
      working-directory: scripts
      run: npm install

    - name: Verify the post is live before promoting
      if: ${{ env.SHOULD_POST_WEEKLY_SOCIAL == 'true' && github.event.inputs.dry_run != 'true' }}
      run: |
        # Confirm the canonical post URL actually serves (HTTP 200) before we
        # post. A future-dated or not-yet-built post would otherwise be promoted
        # with links that 404. Uses the same URL the social posts link to.
        URL=$(node --input-type=module -e "import { extractSocialContent } from './scripts/extract-social-content.js'; const r = extractSocialContent(process.argv[1]); if (!r.blogUrl) process.exit(2); console.log(r.blogUrl);" "$POST_FILE")
        echo "Verifying ${URL}"
        # -L follows redirects. Without it the blog's move to juanjofuchs.com on
        # 2026-08-11 made every check read the 301 as "not live yet" and burn all
        # 20 attempts, because a redirect is not 200. A reader following that
        # link lands on the post regardless, which is what this step is actually
        # asking about.
        for attempt in $(seq 1 20); do
          CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$URL")
          if [ "$CODE" = "200" ]; then
            echo "Post is live (HTTP 200)."
            exit 0
          fi
          echo "Not live yet (HTTP ${CODE}); attempt ${attempt}/20"
          sleep 15
        done
        echo "::error::Post ${URL} never returned 200; refusing to promote with dead links. Check the post date offset (should be EDT/EST for its date) and that Pages built."
        exit 1

    - name: Prepare LinkedIn access token
      if: env.SHOULD_POST_WEEKLY_SOCIAL == 'true'
      env:
        LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
        LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
        LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
      run: node scripts/refresh-linkedin-token.js

    - name: Post weekly social
      if: env.SHOULD_POST_WEEKLY_SOCIAL == 'true'
      env:
        X_API_KEY: ${{ secrets.X_API_KEY }}
        X_API_SECRET: ${{ secrets.X_API_SECRET }}
        X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
        X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        SOCIAL_LINKEDIN_ENABLED: ${{ vars.SOCIAL_LINKEDIN_ENABLED }}
        SOCIAL_X_ENABLED: ${{ vars.SOCIAL_X_ENABLED }}
      run: |
        ARGS=("$POST_FILE")

        if [ "${{ inputs.dry_run }}" = "true" ]; then
          ARGS+=(--dry-run)
        fi

        node scripts/post-to-social-media.js "${ARGS[@]}"

    # always(), because the newsletter and the social platforms are independent:
    # an expired LinkedIn token should not also hold back the email. Re-running is
    # safe, since send-kit-broadcast.js skips a post that already carries a
    # KIT_SENT marker, committed by the same step that commits PUBLISHED flags.
    - name: Email the post to the Kit list
      if: ${{ always() && env.SHOULD_POST_WEEKLY_SOCIAL == 'true' }}
      env:
        KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
      run: |
        if [ -z "$KIT_API_KEY" ]; then
          echo "::warning::KIT_API_KEY is not set; skipping the newsletter send"
          exit 0
        fi

        ARGS=("$POST_FILE")

        if [ "${{ inputs.dry_run }}" = "true" ]; then
          ARGS+=(--dry-run)
        fi

        node scripts/send-kit-broadcast.js "${ARGS[@]}"

    # always(): the posting step now exits non-zero when a platform fails, and the
    # PUBLISHED markers for whatever DID post must still be committed. Otherwise a
    # re-run (to fix the failed platform) would double-post the one that succeeded.
    - name: Commit published flags
      if: ${{ always() && env.SHOULD_POST_WEEKLY_SOCIAL == 'true' && github.event.inputs.dry_run != 'true' }}
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"

        if git diff --quiet _posts/; then
          echo "No posts were marked as published"
        else
          git add _posts/
          git commit -m "chore: mark weekly social post as published [skip ci]"
          git pull --rebase origin main
          git push
          echo "Published flags committed and pushed"
        fi
