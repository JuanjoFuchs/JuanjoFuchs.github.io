# Site settings
title: JuanjoFuchs Blog
email: your-email@example.com
description: >- # this means to ignore newlines until "baseurl:"
  A personal blog powered by Jekyll and GitHub Pages.
  Write an awesome description for your new site here.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://juanjofuchs.github.io" # the base hostname & protocol for your site
twitter_username: jekyllrb
github_username:  JuanjoFuchs

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
