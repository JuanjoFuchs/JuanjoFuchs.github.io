# Site settings
title: JuanjoFuchs Blog
email: # Add your email here if you want it displayed
description: >- # this means to ignore newlines until "baseurl:"
  Personal blog sharing technical tutorials, project insights, and thoughts on software development.
  Powered by Jekyll and hosted on GitHub Pages.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://juanjofuchs.github.io" # the base hostname & protocol for your site

# SEO Settings
lang: en
author: JuanjoFuchs

# Social Media & SEO defaults
social:
  name: JuanjoFuchs
  links:
    - https://github.com/JuanjoFuchs
    - https://www.linkedin.com/in/JuanjoFuchs

# Default Front Matter for SEO
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "JuanjoFuchs"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Build settings
remote_theme: jekyll/minima
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Theme settings
minima:
  skin: auto
  social_links:
    - title: "GitHub"
      icon: "github"
      url: "https://github.com/JuanjoFuchs"
    - title: "X (Twitter)"
      icon: "x-twitter"
      url: "https://x.com/JuanjoFuchs"
    - title: "LinkedIn"
      icon: "linkedin"
      url: "https://www.linkedin.com/in/JuanjoFuchs"

# Publishing settings
future: false  # Don't publish posts with future dates

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - CLAUDE.md
  - AGENTS.md
  - README.md
  - specs/
  - scripts/
